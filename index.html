<script>

const APPS=["iFood","Keeta","Uber Moto"],K="rotaLucrativa";let PLANO=0;const PNOMES={0:"Sem plano",1:"Reserva",2:"Meio Tanque",3:"Tanque Cheio"},PRECO={1:"R$ 19,90/mês",2:"R$ 37,90/mês",3:"R$ 57,90/mês"};

moto:{modelo:"",ano:"",kmAtual:0,kml:0,comb:"Gasolina",preco:0},

...["Óleo do motor","Filtros","Pneus","Relação","Freios","Manutenção preventiva","Manutenção corretiva","Lavagem e conservação","Depreciação da moto"].map(n=>({n,t:"v",preco:0,km:0}))],
sust:["Aluguel","Alimentação","Água","Energia elétrica","Internet","Telefone","Saúde e medicamentos","Transporte","Despesas domésticas","Outras despesas pessoais e familiares"].map(n=>({n,v:0})),
res:["Troca de óleo","Pneus","Relação","Manutenção preventiva","Reparos inesperados","Acidentes e colisões","Franquia do seguro","Quedas e danos na moto","Períodos sem poder trabalhar","Emergências mecânicas"].map(n=>({n,meta:0,saldo:0})),
cfg:{minKm:0,minHora:0,minCorrida:0,kmMes:0,dias:0,horas:0,resMes:0,invMes:0,lucMes:0,pct:{giro:0,emerg:0,acid:0,prol:0,inv:0,luc:0}},
corr:[],desp:[],man:[]}}
let S=load(),T="";
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s)return Object.assign(def(),s)}catch(e){}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}gauto()}
const get=p=>p.split(".").reduce((o,k)=>o[k],S);
function set(p,v,s){const k=p.split(".");let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=s?v:num(v);save();upd()}
const inp=(p,l,s)=>`<label>${l}<input ${s?"":'inputmode="decimal"'} value="${esc(get(p)||"")}" placeholder="${s?"":"0"}" onchange="set('${p}',this.value,${!!s})"></label>`;

/* ===== Aviso de backup (7 dias) ===== */
const BK_K=K+"Bkp";
function bkMarca(){lsSet(BK_K,String(Date.now()))}
function avisoBkp(){if(!S.corr.length&&!S.desp.length&&!S.man.length)return"";let t=+lsGet(BK_K)||0;if(!t){lsSet(BK_K,String(Date.now()));return""}
const d=Math.floor((Date.now()-t)/864e5);if(d<7)return"";
return`<div class="al" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>💾 Faz ${d} dias sem backup. Se o navegador for limpo, você perde os dados.</span><button class="sm" onclick="bkp()">Fazer agora</button></div>`}

/* ===== Google Drive: backup na conta do próprio cliente ===== */
const GCLIENT=""; /* cole aqui o ID de cliente do Google. Vazio = os botões do Google ficam escondidos */
const GFILE="rota-lucrativa-backup.json",GK=K+"Google";
let GTOK=null,GEXP=0,GT=0;
function gget(){try{return JSON.parse(localStorage.getItem(GK))||{}}catch(e){return{}}}
function gset(o){try{localStorage.setItem(GK,JSON.stringify(Object.assign(gget(),o)))}catch(e){}}
function gscript(){return new Promise((ok,er)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return ok();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=()=>ok();s.onerror=()=>er(new Error("offline"));document.head.appendChild(s)})}
function gtoken(){return new Promise((ok,er)=>{if(GTOK&&Date.now()<GEXP)return ok(GTOK);
gscript().then(()=>{const c=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:"openid email https://www.googleapis.com/auth/drive.appdata",
callback:r=>{if(r.error)return er(new Error(r.error));GTOK=r.access_token;GEXP=Date.now()+((+r.expires_in||3600)-60)*1000;ok(GTOK)},
error_callback:e=>er(new Error((e&&e.type)||"erro"))});
c.requestAccessToken({prompt:gget().email?"":"select_account"})}).catch(er)})}
async function gfetch(u,o){const t=await gtoken();o=o||{};o.headers=Object.assign({Authorization:"Bearer "+t},o.headers||{});const r=await fetch(u,o);if(r.status==401)GTOK=null;if(!r.ok)throw new Error("HTTP "+r.status);return r}
async function gemail(){try{const r=await gfetch("https://www.googleapis.com/oauth2/v3/userinfo");const j=await r.json();if(j.email)gset({email:j.email})}catch(e){}}
async function gfind(){const r=await gfetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields="+encodeURIComponent("files(id,modifiedTime)")+"&q="+encodeURIComponent("name='"+GFILE+"'"));const j=await r.json();return j.files&&j.files[0]||null}
async function gsave(){const body=JSON.stringify(S),f=await gfind();
if(f){await gfetch("https://www.googleapis.com/upload/drive/v3/files/"+f.id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body})}
else{const b="rl"+Date.now(),m=JSON.stringify({name:GFILE,parents:["appDataFolder"]});
await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:"--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+m+"\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+b+"--"})}bkMarca()}
function gauto(){if(!GCLIENT)return;clearTimeout(GT);if(GTOK&&Date.now()<GEXP)GT=setTimeout(()=>{if(GTOK&&Date.now()<GEXP)gsave().then(()=>{gset({last:fd(Date.now())});const e=document.getElementById("gst");if(e)e.textContent="Último backup no Drive: "+gget().last}).catch(()=>{})},15000)}
function gerro(e){const m=String(e&&e.message||e);alert(/popup|access_denied|cancel/i.test(m)?"Login cancelado.":"Não foi possível falar com o Google. Confira a internet e tente de novo.")}
async function gSalvar(){try{await gtoken();if(!gget().email)await gemail();await gsave();gset({last:fd(Date.now())});render();alert("Backup salvo no seu Google Drive.")}catch(e){gerro(e)}}
async function gRestaurar(){try{const f=await gfind();if(!gget().email)await gemail();if(!f){alert("Nenhum backup encontrado nesta conta Google.");return}
const r=await gfetch("https://www.googleapis.com/drive/v3/files/"+f.id+"?alt=media");const o=await r.json();if(!o.moto||!o.corr)throw new Error("invalido");
ask("Substituir os dados atuais pelo backup do Google Drive?",()=>{S=Object.assign(def(),o);save();render();alert("Backup restaurado.")})}catch(e){if(String(e&&e.message)=="invalido")alert("O backup encontrado é inválido.");else gerro(e)}}
function gSair(){try{if(GTOK&&window.google)google.accounts.oauth2.revoke(GTOK,()=>{})}catch(e){}GTOK=null;GEXP=0;gset({email:"",last:""});render()}
function gcard(){if(!GCLIENT)return"";const g=gget();
return`<div class="card"><b>Backup na sua conta Google</b><small>Seus dados ficam no seu próprio Google Drive, numa pasta escondida só deste app. Nós não temos acesso.</small>
${g.email?`<div class="t" style="margin-top:8px"><span>Conta</span><b>${esc(g.email)}</b></div>`:""}
<button class="btn" onclick="gSalvar()">${g.email?"Salvar agora no Google Drive":"Entrar com Google e salvar"}</button>
<button class="btn s" onclick="gRestaurar()">Restaurar do Google Drive</button>
${g.email?'<button class="btn s" onclick="gSair()">Sair da conta Google</button>':""}
<small id="gst" style="display:block;margin-top:8px">${g.last?"Último backup no Drive: "+esc(g.last):"Nenhum backup no Drive ainda."}</small></div>`}

/* ===== Acesso por plano (um único app) ===== */
const MODO_TESTE=false; /* só para o dono testar: true deixa QUALQUER pessoa escolher o plano. Para vender, deixe false. */
const DONO="LUCAS-RL-8472"; /* código do dono: libera o Tanque Cheio sem vencimento. Escreva SEMPRE em MAIÚSCULAS. */
let ACESSO={plano:0,venceEm:null,cliente:""};
const LINKS={1:"https://www.mercadopago.com.br/subscriptions/checkout?preapproval_plan_id=fac6a573dfac4f0987eea49afc88daff",2:"https://www.mercadopago.com.br/subscriptions/checkout?preapproval_plan_id=b3823ffc25f54075a505f73444a6499e",3:"https://www.mercadopago.com.br/subscriptions/checkout?preapproval_plan_id=b52b0db9026d4181a9bdc9d227815a5e"};
const MIN={inicio:2,calc:1,ganhos:2,fin:3,moto:1,rel:2};
const FEATS={1:["Calculadora com semáforo","Lucro por km e por hora","Custo real da moto por km","Backup e suporte por e-mail"],
2:["Tudo do plano Reserva","Registro de corridas e despesas","Fechamento do dia, da semana e do mês","Gráficos de faturamento","Comparação entre iFood, Keeta e Uber Moto"],
3:["Tudo do plano Meio Tanque","Sustento da casa e metas","Divisão do lucro: giro, reservas e salário","Alertas de manutenção da moto","Exportar para Excel"]};
function testeGet(){try{return JSON.parse(localStorage.getItem(K+"Teste"))||{}}catch(e){return{}}}
function testeSet(k,v){const t=testeGet();t[k]=v;try{localStorage.setItem(K+"Teste",JSON.stringify(t))}catch(e){}render()}
function acessoAtual(){if(lsGet(K+"Dono")=="1")return{plano:3,venceEm:null,cliente:"Dono"};if(MODO_TESTE){const t=testeGet(),p=t.plano==null?3:+t.plano;let v=null;if(t.venc=="3d")v=Date.now()+3*864e5;if(t.venc=="x")v=Date.now()-864e5;return{plano:p,venceEm:v}}return ACESSO}
function planoAtual(){const a=acessoAtual();if(!a.plano)return 0;if(a.venceEm&&agora()>new Date(a.venceEm).getTime())return 0;return a.plano}
function avisoPlano(){const a=acessoAtual();if(!a.plano||!a.venceEm)return"";const d=Math.ceil((new Date(a.venceEm).getTime()-agora())/864e5);
if(d<0)return`<div class="al b">Seu plano venceu. Renove para voltar a usar as áreas do plano. Seus dados continuam salvos.</div>`;
if(d<=5)return`<div class="al">Seu plano vence em ${d} dia${d==1?"":"s"}. Renove para não perder o acesso.</div>`;return""}
function testeBar(){const t=testeGet(),p=t.plano==null?3:+t.plano;
return`<div class="al" style="border-color:#e0a100"><b>MODO TESTE</b> (só para você testar; desligue antes de vender)<div class="row"><label>Plano<select onchange="testeSet('plano',this.value)">${[0,1,2,3].map(x=>`<option value="${x}" ${x==p?"selected":""}>${PNOMES[x]}</option>`).join("")}</select></label><label>Vencimento<select onchange="testeSet('venc',this.value)">${[["","Sem aviso"],["3d","Vence em 3 dias"],["x","Vencido"]].map(o=>`<option value="${o[0]}" ${(t.venc||"")==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label></div></div>`}
const comprarBtn=(p,t)=>LINKS[p]?`<a class="btn" style="text-decoration:none;text-align:center" href="${LINKS[p]}" target="_blank" rel="noopener">${t}</a>`:`<button class="btn" onclick="comprar(${p})">${t}</button>`;

function desbloquear(m){window.PF=m;go("planos")}
/* ===== Código de acesso (assinado) ===== */
const PUBKEY={"kty":"EC","crv":"P-256","x":"ZVk_4_gBSVI4TvR-bKPQ83pOwLkZInVfrftvYANwkTs","y":"CI4ClOFeZNgNWLsEiXigcQpU1HptoGt59CmoV2kNVtk"};
const LIC_K=K+"Licenca",VISTO_K=K+"Visto";let LICERR="";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function agora(){const v=+lsGet(VISTO_K)||0,n=Date.now();if(n>v)lsSet(VISTO_K,String(n));return Math.max(n,v)}
function ymd(t,fim){if(!/^\d{8}$/.test(t||""))return 0;const y=+t.slice(0,4),m=+t.slice(4,6),d=+t.slice(6,8);return fim?new Date(y,m-1,d,23,59,59).getTime():new Date(y,m-1,d).getTime()}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function licVerify(code){const ruim={ok:0,msg:"Código inválido. Copie o código inteiro, sem cortar nem mudar nada."};
code=String(code||"").replace(/\s+/g,"");const pt=code.split(".");if(pt.length!=2)return ruim;
if(!(window.crypto&&crypto.subtle))return{ok:0,msg:"Abra o app pelo link do navegador (https) para ativar o código."};
let pl,sg,bom=false;try{pl=b64d(pt[0]);sg=b64d(pt[1])}catch(e){return ruim}
try{const k=await crypto.subtle.importKey("jwk",PUBKEY,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);bom=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,sg,pl)}catch(e){}
if(!bom)return ruim;const t=new TextDecoder().decode(pl).split("|"),p=+t[0],i=ymd(t[1]),v=ymd(t[2],1);

/* ===== cálculos ===== */
function ck(){const m=S.moto,f=m.kml>0?m.preco/m.kml:0;let v=0,fx=0;
S.itens.forEach(i=>{if(i.t=="v"&&i.km>0)v+=i.preco/i.km;if(i.t=="f")fx+=i.preco/(i.meses||1)});
const fk=S.cfg.kmMes>0?fx/S.cfg.kmMes:0;return{f,v,fx,fk,t:f+v+fk}}
function range(p){const n=new Date();let a=new Date(n.getFullYear(),n.getMonth(),n.getDate()),b=new Date(a);b.setDate(b.getDate()+1);
if(p=="semana"){a.setDate(a.getDate()-((a.getDay()+6)%7));b=new Date(a);b.setDate(b.getDate()+7)}
if(p=="mes"){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,1)}
if(p=="tudo"){a=new Date(2000,0,1);b=new Date(2100,0,1)}return[a,b]}
const inR=(r,p)=>{const x=new Date(r.t),[a,b]=range(p);return x>=a&&x<b};
function agg(p,app){let v=0,km=0,mi=0,c=0;const rs=S.corr.filter(r=>inR(r,p)&&(!app||r.app==app));
rs.forEach(r=>{v+=r.v;km+=r.km;mi+=r.min;c+=r.c});
return{n:rs.length,v,km,h:mi/60,c,l:v-c,kmv:km?v/km:0,hv:mi?v/(mi/60):0,lkm:km?(v-c)/km:0,lh:mi?(v-c)/(mi/60):0}}
const dsp=(p,prof)=>S.desp.filter(d=>inR(d,p)&&(prof?d.tp=="p":1)).reduce((s,d)=>s+d.v,0);
const pSum=()=>Object.values(S.cfg.pct).reduce((a,b)=>a+b,0);
function sep(l){const x=Math.max(l,0),o={};for(const k in PCT)o[k]=x*S.cfg.pct[k]/100;return o}
const sustMes=()=>S.sust.reduce((s,x)=>s+x.v,0);
const motoMes=()=>{const c=ck(),k=S.cfg.kmMes;return c.fx+k*(c.f+c.v)};
const rsv=()=>S.res.reduce((s,r)=>s+r.saldo,0);
function sumR(a,b){return S.corr.reduce((s,r)=>{const x=new Date(r.t);return x>=a&&x<b?s+r.v:s},0)}
const bars=(t,a)=>{const mx=Math.max(...a.map(x=>x[1]),1);return`<div class="card"><b>${t}</b><div class="bars">${a.map(x=>`<div class="bc"><em style="font-style:normal">${Math.round(x[1])}</em><i style="height:${x[1]/mx*80}%"></i><span>${x[0]}</span></div>`).join("")}</div></div>`};
function series(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),D=[],W=[],M=[];
for(let i=6;i>=0;i--){const a=new Date(y,m,d-i);D.push([a.getDate()+"/"+(a.getMonth()+1),sumR(a,new Date(y,m,d-i+1))])}
const mon=new Date(y,m,d-((n.getDay()+6)%7));
for(let i=3;i>=0;i--){const a=new Date(mon);a.setDate(a.getDate()-7*i);const b=new Date(a);b.setDate(b.getDate()+7);W.push([a.getDate()+"/"+(a.getMonth()+1),sumR(a,b)])}
for(let i=5;i>=0;i--){const a=new Date(y,m-i,1);M.push([a.toLocaleString("pt-BR",{month:"short"}),sumR(a,new Date(y,m-i+1,1))])}
return{D,W,M}}

const tr=(l,v)=>`<div class="t"><span>${l}</span><b>${v}</b></div>`;

function vInicio(){const d=agg("dia"),w=agg("semana"),m=agg("mes"),a=agg("tudo"),s=sep(m.l),sm=sustMes(),al=[];
if(ck().t==0)al.push(["Cadastre sua moto e seus custos em <b>Minha moto</b> para o lucro ser calculado corretamente.",1]);

async function dl(n,d){const ty=/\.csv$/i.test(n)?"text/csv":"application/json";
try{const f=new File([d],n,{type:ty});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return 1}}catch(e){if(e&&e.name=="AbortError")return 0}
try{const u=URL.createObjectURL(new Blob([d],{type:ty})),a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return 1}catch(e){alert("Não foi possível salvar o arquivo.");return 0}}

function rest(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.moto||!o.corr)throw 0;ask("Substituir os dados atuais pelo backup?",()=>{S=Object.assign(def(),o);save();bkMarca();render();alert("Backup restaurado.")})}catch(e){alert("Arquivo de backup inválido.")}};r.readAsText(f)}
